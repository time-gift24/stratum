name: Rust

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: web (lint, typecheck, test, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: stratum-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: stratum-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Rust workspace
        id: workspace
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No root Cargo.toml found; skipping Rust checks."
          fi

      - name: Install Rust
        if: steps.workspace.outputs.present == 'true'
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Check formatting
        if: steps.workspace.outputs.present == 'true'
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: steps.workspace.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run unit tests
        if: steps.workspace.outputs.present == 'true'
        run: cargo test --workspace --all-targets

  audit:
    name: audit (cargo-audit, cargo-deny)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Rust workspace
        id: workspace
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No root Cargo.toml found; skipping dependency audits."
          fi

      - name: Install Rust
        if: steps.workspace.outputs.present == 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit and cargo-deny
        if: steps.workspace.outputs.present == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit known vulnerabilities
        if: steps.workspace.outputs.present == 'true'
        run: cargo audit

      - name: Check advisories, licenses, bans, and sources
        if: steps.workspace.outputs.present == 'true'
        run: cargo deny check

  image:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: check

    strategy:
      fail-fast: false
      matrix:
        include:
          - package: stratum-api
            bin: stratum-api
            image: stratum-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Rust workspace
        id: workspace
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No root Cargo.toml found; skipping image build."
          fi

      - name: Install Rust
        if: steps.workspace.outputs.present == 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Detect image target
        id: target
        if: steps.workspace.outputs.present == 'true'
        run: |
          if cargo metadata --no-deps --format-version 1 \
            | jq -e --arg package "${{ matrix.package }}" --arg bin "${{ matrix.bin }}" \
              '.packages[]
                | select(.name == $package)
                | .targets[]
                | select(.name == $bin)
                | select(.kind | index("bin"))' >/dev/null
          then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No ${{ matrix.package }}/${{ matrix.bin }} binary found; skipping image build."
          fi

      - name: Set up Docker Buildx
        if: steps.target.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.target.outputs.present == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rust
          push: false
          tags: ${{ matrix.image }}:ci
          build-args: |
            PACKAGE=${{ matrix.package }}
            BIN=${{ matrix.bin }}
          cache-from: type=gha,scope=rust-${{ matrix.package }}-${{ matrix.bin }}
          cache-to: type=gha,mode=max,scope=rust-${{ matrix.package }}-${{ matrix.bin }}

  integration:
    name: integration
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Rust workspace
        id: workspace
        run: |
          if [ -f Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No root Cargo.toml found; skipping integration tests."
          fi

      - name: Install Rust
        if: steps.workspace.outputs.present == 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Run stratum-infra integration tests
        if: steps.workspace.outputs.present == 'true'
        run: make -C crates/stratum-infra test-integration COMPOSE="docker compose"

      - name: Run stratum-postgres integration tests
        if: steps.workspace.outputs.present == 'true'
        run: make -C crates/stratum-postgres test-integration COMPOSE="docker compose"

      - name: Run stratum-ontology integration tests
        if: steps.workspace.outputs.present == 'true'
        run: make -C crates/stratum-ontology test-integration COMPOSE="docker compose"

      - name: Run stratum-studio integration tests
        if: steps.workspace.outputs.present == 'true'
        run: make -C crates/stratum-studio test-integration COMPOSE="docker compose"

      - name: Run stratum-api integration tests
        if: steps.workspace.outputs.present == 'true'
        run: make -C crates/stratum-api test-integration COMPOSE="docker compose"
