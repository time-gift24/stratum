name: stratum-ontology-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stratum_ontology_test
      POSTGRES_USER: stratum_ontology
      POSTGRES_PASSWORD: stratum_ontology
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratum_ontology -d stratum_ontology_test"]
      interval: 1s
      timeout: 1s
      retries: 20
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
