[api]
bind = "127.0.0.1:8080"
readiness_timeout_ms = 1000
allowed_origins = [
  "http://127.0.0.1:5174",
  "http://localhost:5174",
]

[ontology]
database_url = "postgres://stratum:stratum@postgres:5432/stratum_ontology"

[studio]
management_enabled = true
database_url = "postgres://stratum:stratum@postgres:5432/stratum_studio"

[tools]
workspace_root = "/workspace"

[nats]
url = "nats://nats:4222"
stream_name = "AGENT_EVENTS"
subject_prefix = "events.agent"
replicas = 1
max_age_seconds = 3600
max_bytes = 268435456
max_messages = 100000

[postgres]
url = "postgres://stratum:stratum@postgres:5432/stratum"
