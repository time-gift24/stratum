[api]
bind = "0.0.0.0:8080"
readiness_timeout_ms = 1000
allowed_origins = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "http://localhost:5175",
  "http://127.0.0.1:5175",
]

[ontology]
database_url = "postgres://stratum:stratum@postgres:5432/stratum_ontology"

# Studio 数据库始终用于 runtime；docker 栈只关闭管理 routes。
# management_enabled = true 要求
# api.bind 为 loopback（loopback-only 安全边界），而容器需要 0.0.0.0 才能
# 发布端口，两者冲突。本地直跑（127.0.0.1 bind）时可开启。
[studio]
management_enabled = false
database_url = "postgres://stratum:stratum@postgres:5432/stratum_studio"

[nats]
url = "nats://nats:4222"
stream_name = "AGENT_EVENTS"
subject_prefix = "events.agent"
replicas = 1
max_age_seconds = 3600
max_bytes = 268435456
max_messages = 100000

[postgres]
url = "postgres://stratum:stratum@postgres:5432/stratum"
