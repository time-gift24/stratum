[agent]
templates_root = "/etc/stratum/templates"

[llm]
default = "deepseek:deepseek-v4-flash"

[llm.deepseek]
# Overridden at process startup from DEEPSEEK_API_KEY.
api_key = "injected-at-runtime"
models = ["deepseek-v4-flash", "deepseek-v4-pro"]
# Optional endpoint override (e.g. an LLM gateway); when omitted the
# provider's well-known public endpoint is used. Blank is rejected.
# base_url = "https://api.deepseek.com"

[api]
bind = "0.0.0.0:8080"
readiness_timeout_ms = 1000
allowed_origins = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
  "http://localhost:5175",
  "http://127.0.0.1:5175",
]

[ontology]
database_url = "postgres://stratum:stratum@postgres:5432/stratum_ontology"

# Studio 编排目录在 docker 栈保持关闭：management_enabled = true 要求
# api.bind 为 loopback（loopback-only 安全边界），而容器需要 0.0.0.0 才能
# 发布端口，两者冲突。本地直跑（127.0.0.1 bind）时可开启。
[studio]
management_enabled = false

[nats]
url = "nats://nats:4222"
stream_name = "AGENT_EVENTS"
subject_prefix = "events.agent"
replicas = 1
max_age_seconds = 3600
max_bytes = 268435456
max_messages = 100000

[postgres]
url = "postgres://stratum:stratum@postgres:5432/stratum"
