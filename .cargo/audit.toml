# cargo-audit configuration.
# See https://docs.rs/cargo-audit/latest/cargo_audit/config/index.html

[advisories]
ignore = [
    # rsa 0.9.10 (RUSTSEC-2023-0071, Marvin Attack): enters Cargo.lock only as
    # an optional dependency of sqlx-mysql. The workspace enables sqlx's
    # postgres feature only, so rsa never reaches the compiled dependency
    # graph (`cargo tree -i rsa` is empty for every target). No fixed release
    # exists upstream; revisit when sqlx drops or upgrades the rsa dependency.
    "RUSTSEC-2023-0071",
]
