[agent]
storage_root = "./.stratum/agents"

[llm]
default = "deepseek:deepseek-v4-flash"

[llm.deepseek]
api_key = "replace-with-your-api-key"
models = ["deepseek-v4-flash", "deepseek-v4-pro"]

[api]
bind = "127.0.0.1:8080"
allowed_origins = ["http://localhost:5173"]

[nats]
url = "nats://127.0.0.1:4222"
stream_name = "SESSION_EVENTS"
subject_prefix = "events.session"
replicas = 1
max_age_seconds = 604800
max_bytes = 1073741824
max_messages = 1000000

# Production default: all execution facts live in Postgres.
# For local dev without containers or embedded use, switch to the filesystem
# backend with `backend = "filesystem"` (and drop [storage.postgres]).
[storage]
backend = "postgres"

[storage.postgres]
url = "postgres://stratum:stratum@127.0.0.1:5432/stratum"
