name: stratum

services:
  nats:
    image: nats:2-alpine
    command: ["-js", "--store_dir", "/data", "--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-Y", "off", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 2s
      retries: 15
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: stratum
      POSTGRES_PASSWORD: stratum
      POSTGRES_DB: stratum
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stratum -d stratum"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  stratum-api:
    build:
      context: .
      dockerfile: Dockerfile.rust
      args:
        PACKAGE: stratum-api
        BIN: stratum-api
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "-fsS", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    ports:
      - "18080:8080"
    volumes:
      - ./templates:/etc/stratum/templates:ro
      - ./config.docker.toml:/app/config.toml:ro
    environment:
      RUST_LOG: info

  stratum-web:
    build:
      context: ./stratum-web
    depends_on:
      stratum-api:
        condition: service_healthy
    ports:
      - "5173:3000"

volumes:
  nats-data:
  postgres-data:
